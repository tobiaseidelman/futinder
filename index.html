<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futinder</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #39ff14;
    --green-dim: #1a7a00;
    --red: #ff3a3a;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --surface3: #2a2a2a;
    --text: #f0f0f0;
    --text-muted: #888;
    --radius: 18px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 10px;
    position: sticky; top: 0;
    background: var(--bg); z-index: 10;
  }
  .topbar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 2px; color: var(--green);
  }
  .icon-btn {
    width: 42px; height: 42px;
    background: var(--surface); border: none; border-radius: 50%;
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .badge-dot {
    position: absolute; top: 6px; right: 6px;
    width: 9px; height: 9px;
    background: var(--red); border-radius: 50%;
    border: 2px solid var(--bg); display: none;
  }
  .badge-dot.show { display: block; }

  .navbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: var(--surface);
    display: flex; border-top: 1px solid #222;
    z-index: 100; padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; padding: 14px 0 10px;
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-family: 'DM Sans', sans-serif; font-size: 10px;
  }
  .nav-btn .nav-icon { font-size: 22px; }
  .nav-btn.active { color: var(--green); }

  .cards-area {
    flex: 1; padding: 10px 20px 100px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .partido-card {
    width: 100%; background: var(--surface);
    border-radius: var(--radius); overflow: hidden;
    position: relative; user-select: none;
    border: 1px solid #222;
  }
  .partido-card.swiping { transition: none; }

  .card-img { width: 100%; height: 220px; position: relative; overflow: hidden; }
  .card-img-bg {
    width: 100%; height: 100%;
    background-size: cover; background-position: center;
    background-image: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600');
  }
  .card-img-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    display: flex; align-items: flex-end; padding: 12px 16px;
  }
  .card-cancha-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px;
    letter-spacing: 1px; cursor: pointer; color: white;
  }
  .distance-popup {
    display: none; position: absolute; bottom: 50px; left: 16px;
    background: rgba(0,0,0,0.9); border: 1px solid var(--green);
    border-radius: var(--radius-sm); padding: 8px 12px;
    font-size: 13px; color: var(--green); z-index: 5;
  }
  .distance-popup.show { display: block; }

  .card-body { padding: 16px; }
  .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; flex-wrap: wrap; }
  .card-tag {
    background: var(--surface2); border-radius: 20px;
    padding: 6px 12px; font-size: 13px;
    display: flex; align-items: center; gap: 6px; color: var(--text-muted);
  }
  .card-tag span { color: var(--text); font-weight: 500; }

  .jugadores-bar { margin: 12px 0; }
  .jugadores-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .jugadores-label span { color: var(--text); font-weight: 600; }
  .bar-bg { height: 6px; background: var(--surface3); border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--green); border-radius: 10px; transition: width 0.5s ease; }

  .creador-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
  .creador-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--green-dim); display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; color: var(--green); flex-shrink: 0;
  }
  .creador-info { flex: 1; }
  .creador-nombre { font-size: 14px; font-weight: 600; }
  .creador-sub { font-size: 12px; color: var(--text-muted); }
  .stars { color: #f5c518; font-size: 12px; }

  .card-actions { display: flex; gap: 12px; margin-top: 16px; }
  .action-btn {
    flex: 1; padding: 14px; border: none; border-radius: var(--radius-sm);
    font-size: 22px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    transition: transform 0.15s;
  }
  .action-btn:active { transform: scale(0.95); }
  .btn-no { background: #1a0000; color: var(--red); border: 1px solid #400; }
  .btn-yes { background: #001a00; color: var(--green); border: 1px solid #040; }

  .swipe-hint { display: flex; justify-content: center; gap: 20px; margin-top: 14px; font-size: 12px; color: var(--text-muted); }

  .swipe-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 4px;
    opacity: 0; border-radius: var(--radius); pointer-events: none;
    border: 4px solid transparent;
  }
  .swipe-overlay.yes { color: var(--green); border-color: var(--green); background: rgba(57,255,20,0.08); }
  .swipe-overlay.no { color: var(--red); border-color: var(--red); background: rgba(255,58,58,0.08); }

  .form-screen { padding: 20px; padding-bottom: 100px; flex: 1; overflow-y: auto; }
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
  .form-input {
    width: 100%; background: var(--surface); border: 1px solid #333;
    border-radius: var(--radius-sm); padding: 13px 16px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--green); }
  .form-input::placeholder { color: var(--text-muted); }

  .tipo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tipo-btn {
    background: var(--surface); border: 1px solid #333;
    border-radius: var(--radius-sm); padding: 14px 8px;
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all 0.2s;
  }
  .tipo-btn.selected { border-color: var(--green); color: var(--green); background: #001a00; }

  .submit-btn {
    width: 100%; background: var(--green); color: #000; border: none;
    border-radius: var(--radius-sm); padding: 16px;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px;
    cursor: pointer; margin-top: 10px;
  }
  .submit-btn:active { opacity: 0.85; }

  .perfil-screen { flex: 1; padding-bottom: 100px; overflow-y: auto; }
  .perfil-header { position: relative; height: 200px; overflow: hidden; }
  .perfil-cover { width: 100%; height: 100%; background: linear-gradient(135deg, #001a00, #0a3000); display: flex; align-items: center; justify-content: center; font-size: 80px; }
  .perfil-avatar-wrap { position: absolute; bottom: -40px; left: 20px; }
  .perfil-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--green-dim); border: 3px solid var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--green); }
  .perfil-body { padding: 52px 20px 20px; }
  .perfil-nombre { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 1px; }
  .perfil-pos { display: inline-block; background: var(--green); color: #000; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin: 6px 0 14px; letter-spacing: 1px; text-transform: uppercase; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat-card { background: var(--surface); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; border: 1px solid #222; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--green); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 12px; }
  .bio-text { background: var(--surface); border-radius: var(--radius-sm); padding: 14px; font-size: 14px; color: var(--text-muted); line-height: 1.6; border: 1px solid #222; }
  .zona-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; border: 1px solid #222; }

  .highlight-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .highlight-item { width: 100px; height: 100px; background: var(--surface2); border-radius: var(--radius-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid #222; }
  .highlight-add { border: 1px dashed #444; color: var(--text-muted); font-size: 28px; cursor: pointer; }

  .opinion-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .opinion-bar-label { font-size: 13px; color: var(--text-muted); min-width: 130px; }
  .opinion-bar-track { flex: 1; height: 6px; background: var(--surface3); border-radius: 10px; overflow: hidden; }
  .opinion-bar-fill { height: 100%; background: var(--green); border-radius: 10px; }
  .opinion-bar-pct { font-size: 12px; color: var(--text-muted); min-width: 36px; text-align: right; }
  .opinion-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border-radius: 20px; padding: 7px 13px; font-size: 13px; margin: 4px; border: 1px solid #222; }

  .mis-partidos-list { padding: 0 20px; flex: 1; overflow-y: auto; padding-bottom: 100px; }

  .tabs {
    display: flex;
    margin: 0 20px 16px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 4px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1; padding: 10px; border: none;
    border-radius: 8px;
    background: none; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--surface3); color: var(--green); }
  .partido-item { background: var(--surface); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; border: 1px solid #222; cursor: pointer; }
  .partido-item:active { border-color: var(--green); }
  .partido-item-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .partido-item-sub { font-size: 13px; color: var(--text-muted); }
  .solicitudes-badge { display: inline-block; background: var(--red); color: white; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }

  .confirmados-list { padding: 0 20px; }
  .confirmado-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
  .mini-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }

  .solicitud-card { background: var(--surface); border-radius: var(--radius-sm); padding: 16px; margin: 0 20px 12px; border: 1px solid #222; }
  .solicitud-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; cursor: pointer; }
  .solicitud-actions { display: flex; gap: 10px; }
  .solicitud-btn { flex: 1; padding: 10px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-aceptar { background: #001a00; color: var(--green); border: 1px solid #040; }
  .btn-rechazar { background: #1a0000; color: var(--red); border: 1px solid #400; }

  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
  .msg-own { align-self: flex-end; background: var(--green); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
  .msg-other { align-self: flex-start; background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid #222; }
  .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .chat-input-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: var(--surface); border-top: 1px solid #222; padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid #333; border-radius: 20px; padding: 10px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--green); border: none; color: #000; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .notif-list { padding: 0 20px; flex: 1; overflow-y: auto; }
  .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; margin-top: 6px; }
  .notif-dot.visto { background: transparent; }
  .notif-text { font-size: 14px; line-height: 1.5; }
  .notif-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .onboarding { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; text-align: center; }
  .onboarding-logo { font-family: 'Bebas Neue', sans-serif; font-size: 60px; letter-spacing: 4px; color: var(--green); margin-bottom: 10px; }
  .onboarding-sub { font-size: 15px; color: var(--text-muted); margin-bottom: 40px; }

  .edit-screen { flex: 1; padding: 20px; padding-bottom: 100px; overflow-y: auto; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 50px; margin-bottom: 16px; }
  .empty-text { font-size: 15px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-sheet { background: var(--surface); width: 100%; max-width: 420px; border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 40px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 20px; }
  .modal-perfil-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .modal-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--green-dim); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--green); flex-shrink: 0; }

  .back-btn { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 0; display: flex; align-items: center; }

  /* Loading */
  .loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 999; }
  .loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--green); letter-spacing: 4px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #222; border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-logo">⚽ Futinder</div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="onboarding">
    <div class="onboarding-logo">⚽ Futinder</div>
    <div class="onboarding-sub">La app para armar tu partido</div>
    <button onclick="loginGoogle()" style="width:100%;background:white;color:#333;border:none;border-radius:var(--radius-sm);padding:16px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;">
      <img src="https://www.google.com/favicon.ico" style="width:20px;height:20px;">
      Continuar con Google
    </button>
  </div>
</div>

<!-- CREAR PERFIL -->
<div id="crearPerfil" class="screen">
  <div class="onboarding">
    <div class="onboarding-logo">⚽ Futinder</div>
    <div class="onboarding-sub">La app para armar tu partido</div>
    <div style="width:100%; text-align:left;">
      <div class="form-group">
        <label class="form-label">Tu nombre</label>
        <input class="form-input" id="nombreNuevo" placeholder="Ej: Juan García">
      </div>
      <div class="form-group">
        <label class="form-label">Posición</label>
        <div class="tipo-grid" style="grid-template-columns:repeat(4,1fr);">
          <button class="tipo-btn" onclick="selPos(this,'DC')">DC</button>
          <button class="tipo-btn" onclick="selPos(this,'MCD')">MCD</button>
          <button class="tipo-btn" onclick="selPos(this,'MC')">MC</button>
          <button class="tipo-btn" onclick="selPos(this,'LB')">LB</button>
          <button class="tipo-btn" onclick="selPos(this,'CB')">CB</button>
          <button class="tipo-btn" onclick="selPos(this,'ARQ')">ARQ</button>
          <button class="tipo-btn" onclick="selPos(this,'EXT')">EXT</button>
          <button class="tipo-btn" onclick="selPos(this,'VOL')">VOL</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Mini bio (opcional)</label>
        <input class="form-input" id="bioNueva" placeholder="Ej: Juego los fines de semana...">
      </div>
      <div class="form-group">
        <label class="form-label">Zona</label>
        <input class="form-input" id="zonaNueva" placeholder="Ej: Pocitos, Montevideo">
      </div>
      <button class="submit-btn" onclick="crearPerfil()">CREAR PERFIL</button>
    </div>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="topbar">
    <div class="topbar-title">⚽ Futinder</div>
    <button class="icon-btn" onclick="verNotificaciones()">
      🔔 <span class="badge-dot" id="badgeDot"></span>
    </button>
  </div>
  <div class="cards-area">
    <div id="card" style="width:100%; position:relative;"></div>
    <div class="swipe-hint"><span>← No me interesa</span><span>Quiero jugar →</span></div>
  </div>
  <nav class="navbar">
    <button class="nav-btn active" onclick="irHome()"><span class="nav-icon">🏠</span>Inicio</button>
    <button class="nav-btn" onclick="cambiarPantalla('crear')"><span class="nav-icon">➕</span>Crear</button>
    <button class="nav-btn" onclick="verMisPartidos()"><span class="nav-icon">⚽</span>Mis partidos</button>
    <button class="nav-btn" onclick="verMiPerfil()"><span class="nav-icon">👤</span>Perfil</button>
  </nav>
</div>

<!-- CREAR PARTIDO -->
<div id="crear" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="irHome()">←</button>
    <div class="topbar-title">Nuevo partido</div>
    <div style="width:42px"></div>
  </div>
  <div class="form-screen">
    <div class="form-group">
      <label class="form-label">📍 Cancha</label>
      <input class="form-input" id="cancha" placeholder="Nombre de la cancha">
    </div>
    <div class="form-group">
      <label class="form-label">🕓 Horario</label>
      <input class="form-input" id="hora" type="time" value="17:00">
    </div>
    <div class="form-group">
      <label class="form-label">⏱️ Duración</label>
      <div class="tipo-grid">
        <button class="tipo-btn" onclick="selDur(this,'1h')">1 hora</button>
        <button class="tipo-btn selected" onclick="selDur(this,'1:30h')">1:30 hs</button>
        <button class="tipo-btn" onclick="selDur(this,'2h')">2 horas</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">⚽ Tipo de fútbol</label>
      <div class="tipo-grid">
        <button class="tipo-btn selected" onclick="selTipo(this,'5')">Fútbol 5</button>
        <button class="tipo-btn" onclick="selTipo(this,'7')">Fútbol 7</button>
        <button class="tipo-btn" onclick="selTipo(this,'11')">Fútbol 11</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">👥 ¿Cuántos ya son?</label>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc, query, orderBy, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfMEhIaroFjf3dOHAXnTeolwJdi2kEQyQ",
  authDomain: "futinder-cace8.firebaseapp.com",
  projectId: "futinder-cace8",
  storageBucket: "futinder-cace8.firebasestorage.app",
  messagingSenderId: "561463769028",
  appId: "1:561463769028:web:f1b6e59383f0032cdd1691"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ---- ESTADO ----
let partidos = [];
let perfil = null;
let usuario = null; // usuario de Google
let notificaciones = [];
let idx = 0;
let tipoSel = '5', durSel = '1:30h', posSel = '', posEditSel = '';
let chatUnsub = null, notifUnsub = null, partidosUnsub = null;

// ---- LOGIN CON GOOGLE ----
window.loginGoogle = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    alert("Error al iniciar sesión: " + e.message);
  }
};

window.cerrarSesion = async () => {
  if(notifUnsub) notifUnsub();
  if(partidosUnsub) partidosUnsub();
  if(chatUnsub) chatUnsub();
  perfil = null; usuario = null; partidos = []; notificaciones = [];
  await signOut(auth);
  cambiarPantalla("login");
};

// ---- AUTH STATE ----
onAuthStateChanged(auth, async (user) => {
  document.getElementById("loading").style.display = "none";
  if(!user){
    cambiarPantalla("login");
    return;
  }
  usuario = user;
  // Cargar o crear perfil en Firestore
  const perfilRef = doc(db, "usuarios", user.uid);
  const perfilSnap = await getDoc(perfilRef);
  if(perfilSnap.exists()){
    perfil = perfilSnap.data();
    iniciarPartidos();
    iniciarNotificaciones();
    cambiarPantalla("home");
  } else {
    // Nuevo usuario — pre-llenar con datos de Google
    document.getElementById("nombreNuevo").value = user.displayName || "";
    cambiarPantalla("crearPerfil");
  }
});

// ---- NOTIFICACIONES EN TIEMPO REAL ----
function iniciarNotificaciones(){
  if(!usuario) return;
  if(notifUnsub) notifUnsub();
  const nq = query(
    collection(db, "usuarios", usuario.uid, "notificaciones"),
    orderBy("creadoEn", "desc")
  );
  notifUnsub = onSnapshot(nq, (snap) => {
    notificaciones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadge();
    if(document.getElementById("notificaciones").classList.contains("active")) verNotificaciones();
  });
}

// ---- ESCUCHAR PARTIDOS EN TIEMPO REAL ----
function iniciarPartidos(){
  if(partidosUnsub) partidosUnsub();
  const q = query(collection(db, "partidos"), orderBy("creadoEn", "desc"));
  partidosUnsub = onSnapshot(q, (snap) => {
    partidos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(document.getElementById("home").classList.contains("active")) render();
    if(document.getElementById("misPartidos").classList.contains("active")) verMisPartidos();
  });
}

// ---- NAV ----
window.cambiarPantalla = (id) => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};
window.irHome = () => { render(); cambiarPantalla("home"); };

// ---- BADGE ----
function actualizarBadge(){
  let n = notificaciones.filter(x => !x.visto).length;
  document.getElementById("badgeDot").classList.toggle("show", n > 0);
}

// ---- SWIPE ----
let startX = 0, isDragging = false, cardEl = null, currentX = 0;
function initSwipe(){
  const card = document.querySelector(".partido-card");
  if(!card) return;
  cardEl = card;
  card.addEventListener("touchstart", e => { startX = e.touches[0].clientX; isDragging = true; card.classList.add("swiping"); }, {passive:true});
  card.addEventListener("touchmove", e => {
    if(!isDragging) return;
    currentX = e.touches[0].clientX - startX;
    card.style.transform = `translateX(${currentX}px) rotate(${currentX*0.08}deg)`;
    const yes = card.querySelector(".swipe-overlay.yes");
    const no = card.querySelector(".swipe-overlay.no");
    if(currentX > 0){ yes.style.opacity = Math.min(currentX/80,1); no.style.opacity=0; }
    else { no.style.opacity = Math.min(-currentX/80,1); yes.style.opacity=0; }
  }, {passive:true});
  card.addEventListener("touchend", () => {
    isDragging = false; card.classList.remove("swiping");
    if(currentX > 80) animateAway(1);
    else if(currentX < -80) animateAway(-1);
    else { card.style.transform=''; card.querySelectorAll(".swipe-overlay").forEach(o=>o.style.opacity=0); }
    currentX = 0;
  });
}
function animateAway(dir){
  if(!cardEl) return;
  cardEl.style.transition = "transform 0.35s ease";
  cardEl.style.transform = `translateX(${dir*500}px) rotate(${dir*20}deg)`;
  setTimeout(() => { if(dir>0) window.match(); else window.next(); }, 300);
}

// ---- HOME ----
window.render = () => {
  actualizarBadge();
  const card = document.getElementById("card");
  if(partidos.length === 0){
    card.innerHTML = `<div class="empty"><div class="empty-icon">⚽</div><div class="empty-text">No hay partidos disponibles.<br>¡Creá el primero!</div></div>`;
    return;
  }
  // Filtrar partidos propios
  let partidosFiltrados = perfil ? partidos.filter(p => p.creador !== perfil.nombre) : partidos;
  if(partidosFiltrados.length === 0){
    card.innerHTML = `<div class="empty"><div class="empty-icon">⚽</div><div class="empty-text">No hay partidos disponibles.<br>¡Creá el primero!</div></div>`;
    return;
  }
  if(idx >= partidosFiltrados.length) idx = 0;
  let p = partidosFiltrados[idx];
  let fill = Math.round((p.jugadores / p.max) * 100);
  let esCreador = perfil && p.creador === perfil.nombre;
  let confirmado = perfil && p.confirmados && p.confirmados.includes(perfil.nombre);
  card.innerHTML = `
    <div class="partido-card" style="position:relative;">
      <div class="swipe-overlay yes">QUIERO ✅</div>
      <div class="swipe-overlay no">❌ PASO</div>
      <div class="card-img">
        <div class="card-img-bg"></div>
        <div class="card-img-overlay">
          <div class="card-cancha-name" onclick="toggleDist()">${p.cancha}</div>
        </div>
        <div class="distance-popup" id="distPopup">📍 2.1 km &nbsp; 🕒 10 min</div>
      </div>
      <div class="card-body">
        <div class="card-row">
          <div class="card-tag">🕓 <span>${p.hora}</span></div>
          <div class="card-tag">⏱️ <span>${p.duracion||'1h'}</span></div>
          <div class="card-tag">⚽ <span>Fútbol ${p.tipo}</span></div>
        </div>
        <div class="jugadores-bar">
          <div class="jugadores-label"><span>👥 Jugadores</span><span>${p.jugadores}/${p.max}</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${fill}%"></div></div>
        </div>
        <div class="card-row"><div class="card-tag">💰 <span>$${p.precio||0} / persona</span></div></div>
        <div class="creador-row" onclick="abrirPerfilJugador('${p.creadorUid}','${p.creador}')">
          <div class="creador-avatar">${p.creador?p.creador[0].toUpperCase():'?'}</div>
          <div class="creador-info">
            <div class="creador-nombre">👨‍🔧 ${p.creador}</div>
            <div class="creador-sub"><span class="stars">★★★★★</span> 4.8 · Creador</div>
          </div>
          <span style="color:var(--text-muted)">›</span>
        </div>
        <div class="card-actions">
          <button class="action-btn btn-no" onclick="next()">❌ Paso</button>
          <button class="action-btn btn-yes" onclick="match()">✅ Quiero</button>
        </div>
        ${(esCreador||confirmado)?`<button onclick="abrirChatIdx(${idx})" style="width:100%;margin-top:10px;padding:12px;background:var(--surface2);border:1px solid #333;border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;">💬 Ir al chat</button>`:''}
      </div>
    </div>`;
  initSwipe();
};

window.toggleDist = () => document.getElementById("distPopup").classList.toggle("show");
window.next = () => {
  let filtrados = perfil ? partidos.filter(p => p.creador !== perfil.nombre) : partidos;
  idx = (idx+1) % Math.max(filtrados.length, 1);
  render();
};

window.match = async () => {
  if(!perfil) return;
  let filtrados = perfil ? partidos.filter(p => p.creador !== perfil.nombre) : partidos;
  let p = filtrados[idx];
  if(p.creador === perfil.nombre){ alert("Este partido es tuyo"); return; }
  if((p.solicitudes||[]).some(s => s.nombre === perfil.nombre)){ alert("Ya mandaste solicitud"); return; }
  if((p.confirmados||[]).includes(perfil.nombre)){ alert("Ya estás confirmado"); return; }

  let nuevasSolicitudes = [...(p.solicitudes||[]), {...perfil, uid: usuario.uid}];
  await updateDoc(doc(db, "partidos", p.id), { solicitudes: nuevasSolicitudes });

  // Notificación al creador en Firebase
  await addDoc(collection(db, "usuarios", p.creadorUid, "notificaciones"), {
    tipo: "solicitud",
    texto: `${perfil.nombre} quiere unirse a ${p.cancha}`,
    partidoId: p.id,
    visto: false,
    creadoEn: serverTimestamp()
  });

  render();
  alert("¡Solicitud enviada! ✅");
};

// ---- CREAR PARTIDO ----
window.selTipo = (btn, t) => { tipoSel=t; btn.parentElement.querySelectorAll(".tipo-btn").forEach(b=>b.classList.remove("selected")); btn.classList.add("selected"); };
window.selDur = (btn, d) => { durSel=d; btn.parentElement.querySelectorAll(".tipo-btn").forEach(b=>b.classList.remove("selected")); btn.classList.add("selected"); };
window.selPos = (btn, p) => { posSel=p; btn.parentElement.querySelectorAll(".tipo-btn").forEach(b=>b.classList.remove("selected")); btn.classList.add("selected"); };
window.selPosEdit = (btn, p) => { posEditSel=p; btn.parentElement.querySelectorAll(".tipo-btn").forEach(b=>b.classList.remove("selected")); btn.classList.add("selected"); };

window.crearPartido = async () => {
  let c = document.getElementById("cancha").value.trim();
  let h = document.getElementById("hora").value;
  let j = parseInt(document.getElementById("jugadores").value);
  let pr = document.getElementById("precio").value;
  if(!c||!h||!j){ alert("Completá todos los campos"); return; }
  let max = tipoSel==='11'?22:tipoSel==='7'?14:10;
  await addDoc(collection(db,"partidos"), {
    cancha:c, hora:h, tipo:tipoSel, duracion:durSel,
    jugadores:j, max, precio:pr||0,
    creador:perfil.nombre,
    creadorUid: usuario.uid,
    solicitudes:[], confirmados:[], mensajes:[],
    creadoEn: serverTimestamp()
  });
  irHome();
};

// ---- PERFIL ----
window.crearPerfil = async () => {
  let n = document.getElementById("nombreNuevo").value.trim();
  if(!n){ alert("Ingresá tu nombre"); return; }
  if(!posSel){ alert("Elegí tu posición"); return; }
  perfil = {
    nombre: n,
    posicion: posSel,
    bio: document.getElementById("bioNueva").value,
    zona: document.getElementById("zonaNueva").value,
    partidos: 0,
    rating: 0,
    uid: usuario.uid,
    foto: usuario.photoURL || null,
    email: usuario.email
  };
  await setDoc(doc(db, "usuarios", usuario.uid), perfil);
  iniciarPartidos();
  iniciarNotificaciones();
  irHome();
};

window.verMiPerfil = () => {
  document.getElementById("perfilContent").innerHTML = `
    <div class="perfil-header">
      <div class="perfil-cover">⚽</div>
      <div class="perfil-avatar-wrap">
        ${perfil.foto ? `<img src="${perfil.foto}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);">` : `<div class="perfil-avatar">${perfil.nombre[0].toUpperCase()}</div>`}
      </div>
    </div>
    <div class="perfil-body">
      <div class="perfil-nombre">${perfil.nombre}</div>
      <span class="perfil-pos">${perfil.posicion||'Sin posición'}</span>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${perfil.partidos||0}</div><div class="stat-label">Partidos</div></div>
        <div class="stat-card"><div class="stat-num">${perfil.partidos?perfil.rating.toFixed(1):'-'}</div><div class="stat-label">Reputación</div></div>
        <div class="stat-card" onclick="verOpinionesPropias()"><div class="stat-num">${perfil.partidos||0}</div><div class="stat-label">Opiniones</div></div>
      </div>
      <p class="section-title">Bio</p>
      <div class="bio-text">${perfil.bio||'Sin bio todavía. ¡Editá tu perfil!'}</div>
      <p class="section-title">Zona</p>
      <div class="zona-row">📍 ${perfil.zona||'Sin zona definida'}</div>
      <p class="section-title">Highlights</p>
      <div class="highlight-list">
        <div class="highlight-item highlight-add">➕</div>
        <div class="highlight-item">🎯</div>
        <div class="highlight-item">🔥</div>
      </div>
    </div>`;
  cambiarPantalla("perfil");
};

window.editarPerfil = () => {
  document.getElementById("editNombre").value = perfil.nombre;
  document.getElementById("editBio").value = perfil.bio||'';
  document.getElementById("editZona").value = perfil.zona||'';
  posEditSel = perfil.posicion||'';
  document.querySelectorAll("#editPosGrid .tipo-btn").forEach(b => b.classList.toggle("selected", b.textContent===posEditSel));
  cambiarPantalla("editarPerfil");
};

window.guardarPerfil = async () => {
  perfil.nombre = document.getElementById("editNombre").value.trim()||perfil.nombre;
  perfil.posicion = posEditSel||perfil.posicion;
  perfil.bio = document.getElementById("editBio").value;
  perfil.zona = document.getElementById("editZona").value;
  await setDoc(doc(db, "usuarios", usuario.uid), perfil);
  verMiPerfil();
};

// ---- MIS PARTIDOS ----
let tabActual = 'creados';

window.switchTab = (tab) => {
  tabActual = tab;
  document.getElementById("tab-creados").classList.toggle("active", tab === 'creados');
  document.getElementById("tab-confirmados").classList.toggle("active", tab === 'confirmados');
  renderTabPartidos();
};

function renderTabPartidos(){
  let html = '';
  if(tabActual === 'creados'){
    let mios = partidos.filter(p => p.creadorUid === usuario.uid || p.creador === perfil.nombre);
    if(mios.length === 0){
      html = `<div class="empty"><div class="empty-icon">➕</div><div class="empty-text">No creaste ningún partido todavía.</div></div>`;
    }
    mios.forEach(p => {
      let ri = partidos.indexOf(p);
      let pend = (p.solicitudes||[]).length;
      html += `<div class="partido-item" onclick="verDetalle(${ri})">
        <div class="partido-item-title">${p.cancha}${pend>0?`<span class="solicitudes-badge">${pend}</span>`:''}</div>
        <div class="partido-item-sub">🕓 ${p.hora} · ⚽ Fútbol ${p.tipo} · 👥 ${p.jugadores}/${p.max}</div>
        <div class="partido-item-sub" style="margin-top:4px;">👨‍🔧 Creador · ${pend} solicitud${pend!==1?'es':''} pendiente${pend!==1?'s':''}</div>
      </div>`;
    });
  } else {
    let conf = partidos.filter(p => p.confirmados && p.confirmados.includes(perfil.nombre));
    if(conf.length === 0){
      html = `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Todavía no fuiste confirmado en ningún partido.</div></div>`;
    }
    conf.forEach(p => {
      let ri = partidos.indexOf(p);
      html += `<div class="partido-item" onclick="abrirChatIdx(${ri})">
        <div class="partido-item-title">${p.cancha}</div>
        <div class="partido-item-sub">🕓 ${p.hora} · ⚽ Fútbol ${p.tipo} · 👥 ${p.jugadores}/${p.max}</div>
        <div class="partido-item-sub" style="margin-top:4px;">✅ Confirmado · 💬 Ver chat</div>
      </div>`;
    });
  }
  document.getElementById("listaPartidos").innerHTML = html;
}

window.verMisPartidos = () => {
  tabActual = 'creados';
  document.getElementById("tab-creados").classList.add("active");
  document.getElementById("tab-confirmados").classList.remove("active");
  renderTabPartidos();
  cambiarPantalla("misPartidos");
};

window.verDetalle = (i) => {
  idx = i;
  let p = partidos[i];
  document.getElementById("creadorTitle").textContent = p.cancha;
  let htmlConf = (p.confirmados||[]).length === 0
    ? `<div style="padding:0 20px;color:var(--text-muted);font-size:14px;">Nadie confirmado todavía</div>`
    : (p.confirmados||[]).map(n => `<div class="confirmado-item" style="padding:12px 20px;"><div class="mini-avatar">${n[0].toUpperCase()}</div><div>${n}</div></div>`).join('');
  document.getElementById("listaConfirmados").innerHTML = htmlConf;

  let htmlSol = (p.solicitudes||[]).length === 0
    ? `<div style="padding:0 20px;color:var(--text-muted);font-size:14px;">Sin solicitudes</div>`
    : (p.solicitudes||[]).map((s,si) => `
      <div class="solicitud-card">
        <div class="solicitud-header" onclick="abrirPerfilJugador('${s.nombre}')">
          <div class="mini-avatar">${s.nombre[0].toUpperCase()}</div>
          <div style="flex:1;">
            <div style="font-weight:600;">${s.nombre}</div>
            <div style="font-size:13px;color:var(--text-muted);"><span class="stars">★★★★★</span> · ${s.posicion||'Sin posición'}</div>
          </div>
          <span style="color:var(--text-muted)">›</span>
        </div>
        <div class="solicitud-actions">
          <button class="solicitud-btn btn-rechazar" onclick="rechazar(${si})">❌ Rechazar</button>
          <button class="solicitud-btn btn-aceptar" onclick="aceptar(${si})">✅ Aceptar</button>
        </div>
      </div>`).join('');
  document.getElementById("listaSolicitudes").innerHTML = htmlSol;
  cambiarPantalla("creador");
};

window.aceptar = async (i) => {
  let p = partidos[idx];
  let jugador = p.solicitudes[i];
  let nuevasConf = [...(p.confirmados||[]), jugador.nombre];
  let nuevasSol = [...p.solicitudes];
  nuevasSol.splice(i, 1);
  await updateDoc(doc(db,"partidos",p.id), {
    confirmados: nuevasConf,
    solicitudes: nuevasSol,
    jugadores: p.jugadores + 1
  });
  // Notificación al jugador aceptado
  await addDoc(collection(db, "usuarios", jugador.uid, "notificaciones"), {
    tipo: "aceptado",
    texto: `¡Te aceptaron en ${p.cancha}! Podés entrar al chat.`,
    partidoId: p.id,
    visto: false,
    creadoEn: serverTimestamp()
  });
  verDetalle(idx);
};

window.rechazar = async (i) => {
  let p = partidos[idx];
  let nuevasSol = [...p.solicitudes];
  nuevasSol.splice(i, 1);
  await updateDoc(doc(db,"partidos",p.id), { solicitudes: nuevasSol });
  verDetalle(idx);
};

window.cancelarPartido = async () => {
  let p = partidos[idx];
  let confirmados = p.confirmados || [];
  
  if(!confirm(`¿Cancelar el partido en ${p.cancha}? Se notificará a todos los jugadores confirmados.`)) return;

  // Notificar a cada jugador confirmado
  for(let nombre of confirmados){
    // Buscar uid del jugador en solicitudes o confirmados
    let jugadorData = (p.solicitudes||[]).find(s => s.nombre === nombre);
    let uid = jugadorData ? jugadorData.uid : null;
    if(uid){
      await addDoc(collection(db, "usuarios", uid, "notificaciones"), {
        tipo: "cancelado",
        texto: `El partido en ${p.cancha} (${p.hora}) fue cancelado por el creador.`,
        partidoId: p.id,
        visto: false,
        creadoEn: serverTimestamp()
      });
    }
  }

  // Borrar el partido
  await deleteDoc(doc(db, "partidos", p.id));
  verMisPartidos();
};

// ---- CHAT EN TIEMPO REAL ----
window.abrirChatPartido = () => abrirChatIdx(idx);
window.abrirChatIdx = (i) => {
  idx = i;
  let p = partidos[i];
  let esCreador = perfil && p.creador === perfil.nombre;
  let confirmado = perfil && (p.confirmados||[]).includes(perfil.nombre);
  if(!esCreador && !confirmado){
    alert("Solo pueden entrar al chat el creador y los jugadores confirmados.");
    return;
  }
  document.getElementById("chatTitle").textContent = p.cancha;
  if(chatUnsub) chatUnsub();
  const chatQ = query(collection(db,"partidos",p.id,"mensajes"), orderBy("hora","asc"));
  chatUnsub = onSnapshot(chatQ, (snap) => {
    let html = '';
    snap.docs.forEach(d => {
      let m = d.data();
      let own = perfil && m.nombre === perfil.nombre;
      html += `<div class="msg ${own?'msg-own':'msg-other'}">
        ${!own?`<div class="msg-sender">${m.nombre}</div>`:''}
        ${m.texto}
      </div>`;
    });
    document.getElementById("mensajes").innerHTML = html || `<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">Sin mensajes todavía.<br>¡Rompé el hielo!</div></div>`;
    const el = document.getElementById("mensajes");
    el.scrollTop = el.scrollHeight;
  });
  cambiarPantalla("chat");
};

window.enviarMensaje = async () => {
  let txt = document.getElementById("mensajeInput").value.trim();
  if(!txt) return;
  let p = partidos[idx];
  await addDoc(collection(db,"partidos",p.id,"mensajes"), {
    nombre: perfil.nombre,
    texto: txt,
    hora: serverTimestamp()
  });
  document.getElementById("mensajeInput").value = '';
};

// ---- NOTIFICACIONES ----
window.verNotificaciones = () => {
  let html = notificaciones.length === 0
    ? `<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">Sin notificaciones</div></div>`
    : notificaciones.map((n) => `
        <div class="notif-item" onclick="abrirNotificacion('${n.id}')">
          <div class="notif-dot ${n.visto?'visto':''}"></div>
          <div>
            <div class="notif-text">${n.texto}</div>
            <div class="notif-sub">${n.tipo==='solicitud'?'Solicitud de partido':n.tipo==='cancelado'?'Partido cancelado':'Aceptado en partido'}</div>
          </div>
        </div>`).join('');
  document.getElementById("listaNotificaciones").innerHTML = html;
  cambiarPantalla("notificaciones");
};

window.abrirNotificacion = async (notifId) => {
  let n = notificaciones.find(x => x.id === notifId);
  if(!n) return;
  // Marcar como visto en Firebase
  await updateDoc(doc(db, "usuarios", usuario.uid, "notificaciones", notifId), { visto: true });
  let pi = partidos.findIndex(p => p.id === n.partidoId);
  if(pi >= 0){
    idx = pi;
    if(n.tipo === "solicitud") verMisPartidos(); // lleva al creador a sus partidos
    else abrirChatIdx(idx);
  } else irHome();
};

window.limpiarNotificaciones = async () => {
  for(let n of notificaciones){
    await deleteDoc(doc(db, "usuarios", usuario.uid, "notificaciones", n.id));
  }
  actualizarBadge();
  verNotificaciones();
};

// ---- MODAL JUGADOR ----
window.abrirPerfilJugador = async (uid, nombre) => {
  document.getElementById("modalContent").innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-muted);">Cargando...</div>`;
  document.getElementById("modalJugador").classList.add("show");
  try {
    const snap = await getDoc(doc(db, "usuarios", uid));
    let p = snap.exists() ? snap.data() : { nombre: nombre, posicion: '', bio: 'Sin bio', zona: 'Sin zona', partidos: 0, rating: 0 };
    let foto = p.foto ? `<img src="${p.foto}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);">` : `<div class="modal-avatar">${(p.nombre||nombre)[0].toUpperCase()}</div>`;
    document.getElementById("modalContent").innerHTML = `
      <div class="modal-perfil-header">
        ${foto}
        <div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;">${p.nombre||nombre}</div>
          ${p.posicion ? `<div style="display:inline-block;background:var(--green);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px;">${p.posicion}</div>` : ''}
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${p.partidos||0}</div><div class="stat-label">Partidos</div></div>
        <div class="stat-card"><div class="stat-num">${p.partidos>0?p.rating.toFixed(1):'-'}</div><div class="stat-label">Reputación</div></div>
        <div class="stat-card"><div class="stat-num">-</div><div class="stat-label">Opiniones</div></div>
      </div>
      <p class="section-title" style="margin-top:16px;">Bio</p>
      <div class="bio-text">${p.bio||'Sin bio'}</div>
      <p class="section-title" style="margin-top:12px;">Zona</p>
      <div class="zona-row">📍 ${p.zona||'Sin zona'}</div>`;
  } catch(e) {
    document.getElementById("modalContent").innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-muted);">No se pudo cargar el perfil</div>`;
  }
};
window.cerrarModal = () => document.getElementById("modalJugador").classList.remove("show");

// ---- OPINIONES ----
const opinionesData = [
  {emoji:'👍',label:'Puntual',pct:80},{emoji:'⚽',label:'Juega en equipo',pct:75},
  {emoji:'🔥',label:'Muy habilidoso',pct:70},{emoji:'💪',label:'Corre todo el partido',pct:65},
  {emoji:'🙌',label:'Buena onda',pct:85},{emoji:'🧠',label:'Entiende el juego',pct:60},
  {emoji:'🎯',label:'Define bien',pct:55},{emoji:'🎯',label:'Buenos pases',pct:68},
];
const opinionesTags = ['👍 Puntual','🔥 Muy habilidoso','😅 Morfeta','⚽ Juega en equipo','❌ No la pasa','🙌 Buena onda','⏰ Llega tarde'];

function renderOpiniones(nombre, backFn){
  document.getElementById("opinionesTitle").textContent = nombre;
  document.getElementById("opinionesBackBtn").onclick = backFn;
  document.getElementById("opinionesContent").innerHTML = `
    <div style="display:flex;align-items:baseline;gap:10px;margin:20px 0;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--green);">4.5</div>
      <div><div class="stars" style="font-size:18px;">★★★★½</div><div style="font-size:13px;color:var(--text-muted);">24 opiniones</div></div>
    </div>
    <p class="section-title">Resumen</p>
    ${opinionesData.map(o=>`<div class="opinion-bar-row"><div class="opinion-bar-label">${o.emoji} ${o.label}</div><div class="opinion-bar-track"><div class="opinion-bar-fill" style="width:${o.pct}%"></div></div><div class="opinion-bar-pct">${o.pct}%</div></div>`).join('')}
    <p class="section-title" style="margin-top:20px;">Todas las opiniones</p>
    <div style="display:flex;flex-wrap:wrap;">${opinionesTags.map(t=>`<span class="opinion-tag">${t}</span>`).join('')}</div>`;
  cambiarPantalla("opiniones");
}
window.verOpinionesPropias = () => renderOpiniones(perfil.nombre, () => verMiPerfil());
