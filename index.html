<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #39ff14;
    --green-dim: #1a7a00;
    --red: #ff3a3a;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --surface3: #2a2a2a;
    --text: #f0f0f0;
    --text-muted: #888;
    --radius: 18px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* SCREENS */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* TOPBAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .topbar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--green);
  }
  .icon-btn {
    width: 42px; height: 42px;
    background: var(--surface);
    border: none;
    border-radius: 50%;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: background 0.2s;
  }
  .icon-btn:active { background: var(--surface3); }
  .badge-dot {
    position: absolute;
    top: 6px; right: 6px;
    width: 9px; height: 9px;
    background: var(--red);
    border-radius: 50%;
    border: 2px solid var(--bg);
    display: none;
  }
  .badge-dot.show { display: block; }

  /* NAVBAR */
  .navbar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: var(--surface);
    display: flex;
    border-top: 1px solid #222;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    padding: 14px 0 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 22px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    transition: color 0.2s;
  }
  .nav-btn .nav-icon { font-size: 22px; }
  .nav-btn.active { color: var(--green); }
  .nav-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--red);
    color: white;
    font-size: 9px;
    font-weight: 600;
    border-radius: 20px;
    padding: 1px 5px;
    display: none;
  }
  .nav-badge.show { display: block; }
  .nav-icon-wrap { position: relative; }

  /* CARDS AREA */
  .cards-area {
    flex: 1;
    padding: 10px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* PARTIDO CARD */
  .partido-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    user-select: none;
    transition: transform 0.1s;
    border: 1px solid #222;
  }
  .partido-card.swiping { transition: none; }

  .card-img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: var(--surface3);
    position: relative;
    overflow: hidden;
  }
  .card-img-bg {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-image: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600');
  }
  .card-img-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    display: flex;
    align-items: flex-end;
    padding: 12px 16px;
  }
  .card-cancha-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    cursor: pointer;
    color: white;
  }
  .card-cancha-name:active { color: var(--green); }

  .distance-popup {
    display: none;
    position: absolute;
    bottom: 50px; left: 16px;
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--green);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--green);
    z-index: 5;
  }
  .distance-popup.show { display: block; }

  .card-body { padding: 16px; }

  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .card-tag {
    background: var(--surface2);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
  }
  .card-tag span { color: var(--text); font-weight: 500; }

  .jugadores-bar {
    margin: 12px 0;
  }
  .jugadores-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .jugadores-label span { color: var(--text); font-weight: 600; }
  .bar-bg {
    height: 6px;
    background: var(--surface3);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  .creador-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
    cursor: pointer;
  }
  .creador-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--green-dim);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
    color: var(--green);
    flex-shrink: 0;
  }
  .creador-info { flex: 1; }
  .creador-nombre { font-size: 14px; font-weight: 600; }
  .creador-sub { font-size: 12px; color: var(--text-muted); }
  .stars { color: #f5c518; font-size: 12px; }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .action-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
  }
  .action-btn:active { transform: scale(0.95); }
  .btn-no { background: #1a0000; color: var(--red); border: 1px solid #400; }
  .btn-yes { background: #001a00; color: var(--green); border: 1px solid #040; }

  .swipe-hint {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* CREAR PARTIDO */
  .form-screen {
    padding: 20px;
    padding-bottom: 100px;
    flex: 1;
    overflow-y: auto;
  }
  .form-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--green);
    margin-bottom: 24px;
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: block;
  }
  .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid #333;
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--green); }
  .form-input::placeholder { color: var(--text-muted); }

  .tipo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tipo-btn {
    background: var(--surface);
    border: 1px solid #333;
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .tipo-btn.selected {
    border-color: var(--green);
    color: var(--green);
    background: #001a00;
  }

  .submit-btn {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    padding: 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 10px;
    transition: opacity 0.2s;
  }
  .submit-btn:active { opacity: 0.85; }

  /* PERFIL */
  .perfil-screen {
    flex: 1;
    padding-bottom: 100px;
    overflow-y: auto;
  }
  .perfil-header {
    position: relative;
    height: 200px;
    overflow: hidden;
  }
  .perfil-cover {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #001a00, #0a3000);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }
  .perfil-avatar-wrap {
    position: absolute;
    bottom: -40px;
    left: 20px;
  }
  .perfil-avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--green-dim);
    border: 3px solid var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--green);
  }
  .perfil-body { padding: 52px 20px 20px; }
  .perfil-nombre {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
  }
  .perfil-pos {
    display: inline-block;
    background: var(--green);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin: 6px 0 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px 10px;
    text-align: center;
    border: 1px solid #222;
  }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--green);
  }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 20px 0 12px;
  }

  .bio-text {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    border: 1px solid #222;
  }

  .zona-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 14px;
    border: 1px solid #222;
  }

  .highlight-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .highlight-item {
    width: 100px; height: 100px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    cursor: pointer;
    border: 1px solid #222;
  }
  .highlight-add {
    border: 1px dashed #444;
    color: var(--text-muted);
    font-size: 28px;
  }

  .edit-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid #333;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
    transition: border-color 0.2s;
  }
  .edit-btn:hover { border-color: var(--green); }

  /* OPINIONES */
  .opinion-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .opinion-bar-label { font-size: 13px; color: var(--text-muted); min-width: 130px; }
  .opinion-bar-track {
    flex: 1;
    height: 6px;
    background: var(--surface3);
    border-radius: 10px;
    overflow: hidden;
  }
  .opinion-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 10px;
  }
  .opinion-bar-pct { font-size: 12px; color: var(--text-muted); min-width: 36px; text-align: right; }

  .opinion-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 7px 13px;
    font-size: 13px;
    margin: 4px;
    border: 1px solid #222;
  }

  /* MIS PARTIDOS */
  .mis-partidos-list { padding: 0 20px; flex: 1; overflow-y: auto; }
  .partido-item {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #222;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .partido-item:active { border-color: var(--green); }
  .partido-item-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .partido-item-sub { font-size: 13px; color: var(--text-muted); }
  .solicitudes-badge {
    display: inline-block;
    background: var(--red);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
  }

  /* DETALLE CREADOR */
  .confirmados-list { padding: 0 20px; }
  .confirmado-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .mini-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
    flex-shrink: 0;
  }

  .solicitud-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin: 0 20px 12px;
    border: 1px solid #222;
  }
  .solicitud-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .solicitud-actions { display: flex; gap: 10px; }
  .solicitud-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.2s;
  }
  .solicitud-btn:active { opacity: 0.8; }
  .btn-aceptar { background: #001a00; color: var(--green); border: 1px solid #040; }
  .btn-rechazar { background: #1a0000; color: var(--red); border: 1px solid #400; }

  /* CHAT */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg-own {
    align-self: flex-end;
    background: var(--green);
    color: #000;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg-other {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid #222;
  }
  .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .chat-input-bar {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: var(--surface);
    border-top: 1px solid #222;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid #333;
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    color: #000;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* NOTIFICACIONES */
  .notif-list { padding: 0 20px; flex: 1; overflow-y: auto; }
  .notif-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #1a1a1a;
    cursor: pointer;
  }
  .notif-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    margin-top: 6px;
  }
  .notif-dot.visto { background: transparent; }
  .notif-text { font-size: 14px; line-height: 1.5; }
  .notif-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* CREAR PERFIL */
  .onboarding {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 30px;
    text-align: center;
  }
  .onboarding-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px;
    letter-spacing: 4px;
    color: var(--green);
    margin-bottom: 10px;
  }
  .onboarding-sub {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 40px;
  }

  /* EDITAR PERFIL */
  .edit-screen {
    flex: 1;
    padding: 20px;
    padding-bottom: 100px;
    overflow-y: auto;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 50px; margin-bottom: 16px; }
  .empty-text { font-size: 15px; }

  /* MODAL PERFIL JUGADOR */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    background: var(--surface);
    width: 100%;
    max-width: 420px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 40px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: #444;
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-perfil-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .modal-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--green-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--green);
    flex-shrink: 0;
  }

  /* Scroll oculto */
  ::-webkit-scrollbar { width: 0; }

  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center;
  }

  .swipe-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 4px;
    opacity: 0;
    border-radius: var(--radius);
    pointer-events: none;
    transition: opacity 0.1s;
    border: 4px solid transparent;
  }
  .swipe-overlay.yes {
    color: var(--green);
    border-color: var(--green);
    background: rgba(57,255,20,0.08);
  }
  .swipe-overlay.no {
    color: var(--red);
    border-color: var(--red);
    background: rgba(255,58,58,0.08);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 5px 12px;

<script>
// ---- ESTADO ----
let partidos = JSON.parse(localStorage.getItem("partidos")) || [];
let notificaciones = JSON.parse(localStorage.getItem("notificaciones")) || [];
let perfil = JSON.parse(localStorage.getItem("perfil")) || null;
let idx = 0;
let tipoSeleccionado = '5';
let duracionSeleccionada = '1:30h';
let posSeleccionada = '';
let posEditSeleccionada = '';

function guardar(){
  localStorage.setItem("partidos", JSON.stringify(partidos));
  localStorage.setItem("perfil", JSON.stringify(perfil));
  localStorage.setItem("notificaciones", JSON.stringify(notificaciones));
}

// ---- NAV ----
function cambiarPantalla(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function irHome(){ render(); cambiarPantalla("home"); }

// ---- BADGE ----
function actualizarBadge(){
  let n = notificaciones.filter(x => !x.visto).length;
  document.getElementById("badgeDot").classList.toggle("show", n > 0);
}

// ---- SWIPE ----
let startX = 0, isDragging = false, cardEl = null, currentX = 0;

function initSwipe(){
  const wrapper = document.getElementById("card");
  const card = wrapper.querySelector(".partido-card");
  if(!card) return;
  cardEl = card;

  card.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    isDragging = true;
    card.classList.add("swiping");
  }, {passive:true});

  card.addEventListener("touchmove", e => {
    if(!isDragging) return;
    currentX = e.touches[0].clientX - startX;
    const rotate = currentX * 0.08;
    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
    const yes = card.querySelector(".swipe-overlay.yes");
    const no = card.querySelector(".swipe-overlay.no");
    if(currentX > 0){ yes.style.opacity = Math.min(currentX/80, 1); no.style.opacity = 0; }
    else { no.style.opacity = Math.min(-currentX/80, 1); yes.style.opacity = 0; }
  }, {passive:true});

  card.addEventListener("touchend", () => {
    isDragging = false;
    card.classList.remove("swiping");
    if(currentX > 80){ animateAway(1); }
    else if(currentX < -80){ animateAway(-1); }
    else {
      card.style.transform = '';
      card.querySelectorAll(".swipe-overlay").forEach(o => o.style.opacity = 0);
    }
    currentX = 0;
  });
}

function animateAway(dir){
  if(!cardEl) return;
  cardEl.style.transition = "transform 0.35s ease";
  cardEl.style.transform = `translateX(${dir * 500}px) rotate(${dir * 20}deg)`;
  setTimeout(() => {
    if(dir > 0) match();
    else next();
  }, 300);
}

// ---- HOME RENDER ----
function render(){
  actualizarBadge();
  const card = document.getElementById("card");

  if(partidos.length === 0){
    card.innerHTML = `<div class="empty"><div class="empty-icon">⚽</div><div class="empty-text">No hay partidos disponibles.<br>¡Creá el primero!</div></div>`;
    return;
  }

  if(idx >= partidos.length) idx = 0;
  let p = partidos[idx];
  let fill = Math.round((p.jugadores / p.max) * 100);
  let ini = perfil ? p.creador === perfil.nombre : false;
  let conf = perfil && p.confirmados && p.confirmados.includes(perfil.nombre);

  card.innerHTML = `
    <div class="partido-card" style="position:relative;">
      <div class="swipe-overlay yes">QUIERO ✅</div>
      <div class="swipe-overlay no">❌ PASO</div>

      <div class="card-img">
        <div class="card-img-bg"></div>
        <div class="card-img-overlay">
          <div class="card-cancha-name" onclick="toggleDistancia()">${p.cancha}</div>
        </div>
        <div class="distance-popup" id="distPopup">📍 2.1 km &nbsp; 🕒 10 min</div>
      </div>

      <div class="card-body">
        <div class="card-row">
          <div class="card-tag">🕓 <span>${p.hora}</span></div>
          <div class="card-tag">⏱️ <span>${p.duracion || '1h'}</span></div>
          <div class="card-tag">⚽ <span>Fútbol ${p.tipo}</span></div>
        </div>

        <div class="jugadores-bar">
          <div class="jugadores-label">
            <span>👥 Jugadores</span>
            <span>${p.jugadores}/${p.max}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${fill}%"></div></div>
        </div>

        <div class="card-row">
          <div class="card-tag">💰 <span>$${p.precio || 0} / persona</span></div>
        </div>

        <div class="creador-row" onclick="abrirPerfilJugador('${p.creador}', true)">
          <div class="creador-avatar">${p.creador ? p.creador[0].toUpperCase() : '?'}</div>
          <div class="creador-info">
            <div class="creador-nombre">👨‍🔧 ${p.creador}</div>
            <div class="creador-sub"><span class="stars">★★★★★</span> 4.8 · Creador</div>
          </div>
          <span style="color:var(--text-muted)">›</span>
        </div>

        <div class="card-actions">
          <button class="action-btn btn-no" onclick="next()">❌ Paso</button>
          <button class="action-btn btn-yes" onclick="match()">✅ Quiero</button>
        </div>

        ${(ini || conf) ? `<button onclick="abrirChatHomeIdx()" style="width:100%;margin-top:10px;padding:12px;background:var(--surface2);border:1px solid #333;border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;">💬 Ir al chat</button>` : ''}
      </div>
    </div>
  `;

  initSwipe();
}

function toggleDistancia(){
  document.getElementById("distPopup").classList.toggle("show");
}

function next(){ idx = (idx + 1) % partidos.length; render(); }

function match(){
  if(!perfil) return;
  let p = partidos[idx];
  if(p.creador === perfil.nombre){ alert("Este partido es tuyo"); return; }
  if(!p.solicitudes) p.solicitudes = [];
  if(p.solicitudes.some(s => s.nombre === perfil.nombre)){ alert("Ya mandaste solicitud"); return; }
  if(p.confirmados && p.confirmados.includes(perfil.nombre)){ alert("Ya estás confirmado"); return; }

  p.solicitudes.push({...perfil});
  notificaciones.push({
    tipo: "solicitud",
    texto: `${perfil.nombre} quiere unirse a ${p.cancha}`,
    partidoIndex: idx,
    visto: false
  });
  guardar();
  render();
  alert("¡Solicitud enviada! ✅");
}

// ---- CREAR PARTIDO ----
function selTipo(btn, tipo){
  tipoSeleccionado = tipo;
  btn.parentElement.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}
function selDur(btn, dur){
  duracionSeleccionada = dur;
  btn.parentElement.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}
function selPos(btn, pos){
  posSeleccionada = pos;
  btn.parentElement.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}
function selPosEdit(btn, pos){
  posEditSeleccionada = pos;
  btn.parentElement.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

function crearPartido(){
  let c = document.getElementById("cancha").value.trim();
  let h = document.getElementById("hora").value;
  let j = parseInt(document.getElementById("jugadores").value);
  let pr = document.getElementById("precio").value;

  if(!c || !h || !j){ alert("Completá todos los campos"); return; }

  let max = tipoSeleccionado === '11' ? 22 : tipoSeleccionado === '7' ? 14 : 10;

  partidos.push({
    cancha: c,
    hora: h,
    tipo: tipoSeleccionado,
    duracion: duracionSeleccionada,
    jugadores: j,
    max: max,
    precio: pr || 0,
    creador: perfil.nombre,
    solicitudes: [],
    confirmados: [],
    mensajes: []
  });

  guardar();
  irHome();
}

// ---- PERFIL ----
function verMiPerfil(){
  const html = `
    <div class="perfil-header">
      <div class="perfil-cover">⚽</div>
      <div class="perfil-avatar-wrap">
        <div class="perfil-avatar">${perfil.nombre[0].toUpperCase()}</div>
      </div>
    </div>
    <div class="perfil-body">
      <div class="perfil-nombre">${perfil.nombre}</div>
      <span class="perfil-pos">${perfil.posicion || 'Sin posición'}</span>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num">${perfil.partidos || 0}</div>
          <div class="stat-label">Partidos</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${perfil.partidos ? perfil.rating.toFixed(1) : '-'}</div>
          <div class="stat-label">Reputación</div>
        </div>
        <div class="stat-card" onclick="verOpinionesPropias()">
          <div class="stat-num">${perfil.partidos || 0}</div>
          <div class="stat-label">Opiniones</div>
        </div>
      </div>

      <p class="section-title">Bio</p>
      <div class="bio-text">${perfil.bio || 'Sin bio todavía. ¡Editá tu perfil!'}</div>

      <p class="section-title">Zona</p>
      <div class="zona-row">📍 ${perfil.zona || 'Sin zona definida'}</div>

      <p class="section-title">Highlights</p>
      <div class="highlight-list">
        <div class="highlight-item highlight-add">➕</div>
        <div class="highlight-item">🎯</div>
        <div class="highlight-item">🔥</div>
      </div>
    </div>
  `;
  document.getElementById("perfilContent").innerHTML = html;
  cambiarPantalla("perfil");
}

function editarPerfil(){
  document.getElementById("editNombre").value = perfil.nombre;
  document.getElementById("editBio").value = perfil.bio || '';
  document.getElementById("editZona").value = perfil.zona || '';
  posEditSeleccionada = perfil.posicion || '';
  document.querySelectorAll("#editPosGrid .tipo-btn").forEach(b => {
    b.classList.toggle("selected", b.textContent === posEditSeleccionada);
  });
  cambiarPantalla("editarPerfil");
}

function guardarPerfil(){
  perfil.nombre = document.getElementById("editNombre").value.trim() || perfil.nombre;
  perfil.posicion = posEditSeleccionada || perfil.posicion;
  perfil.bio = document.getElementById("editBio").value;
  perfil.zona = document.getElementById("editZona").value;
  guardar();
  verMiPerfil();
}

function crearPerfil(){
  let n = document.getElementById("nombreNuevo").value.trim();
  if(!n){ alert("Ingresá tu nombre"); return; }
  if(!posSeleccionada){ alert("Elegí tu posición"); return; }

  perfil = {
    nombre: n,
    posicion: posSeleccionada,
    bio: document.getElementById("bioNueva").value,
    zona: document.getElementById("zonaNueva").value,
    partidos: 0,
    rating: 0
  };
  guardar();
  irHome();
}

// ---- MIS PARTIDOS ----
function verMisPartidos(){
  let html = '';
  let mios = partidos.filter(p => p.creador === perfil.nombre);
  let conf = partidos.filter(p => p.confirmados && p.confirmados.includes(perfil.nombre));

  if(mios.length === 0 && conf.length === 0){
    html = `<div class="empty"><div class="empty-icon">⚽</div><div class="empty-text">No tenés partidos todavía.<br>¡Creá uno!</div></div>`;
  }

  mios.forEach((p, i) => {
    let realIdx = partidos.indexOf(p);
    let pend = (p.solicitudes || []).length;
    html += `
      <div class="partido-item" onclick="verDetalle(${realIdx})">
        <div class="partido-item-title">
          ${p.cancha}
          ${pend > 0 ? `<span class="solicitudes-badge">${pend}</span>` : ''}
        </div>
        <div class="partido-item-sub">🕓 ${p.hora} · ⚽ Fútbol ${p.tipo} · 👥 ${p.jugadores}/${p.max}</div>
        <div class="partido-item-sub" style="margin-top:4px;">Creador · ${pend} solicitud${pend !== 1 ? 'es' : ''} pendiente${pend !== 1 ? 's' : ''}</div>
      </div>`;
  });

  conf.forEach((p) => {
    let realIdx = partidos.indexOf(p);
    html += `
      <div class="partido-item" onclick="abrirChatIdx(${realIdx})">
        <div class="partido-item-title">${p.cancha}</div>
        <div class="partido-item-sub">🕓 ${p.hora} · ⚽ Fútbol ${p.tipo} · 👥 ${p.jugadores}/${p.max}</div>
        <div class="partido-item-sub" style="margin-top:4px;">Confirmado · 💬 Ver chat</div>
      </div>`;
  });

  document.getElementById("listaPartidos").innerHTML = html;
  cambiarPantalla("misPartidos");
}

function verDetalle(i){
  idx = i;
  let p = partidos[i];
  document.getElementById("creadorTitle").textContent = p.cancha;

  // confirmados
  let htmlConf = '';
  if(!p.confirmados || p.confirmados.length === 0){
    htmlConf = `<div style="padding:0 20px;color:var(--text-muted);font-size:14px;">Nadie confirmado todavía</div>`;
  } else {
    p.confirmados.forEach(nombre => {
      htmlConf += `
        <div class="confirmado-item" style="padding:12px 20px;">
          <div class="mini-avatar">${nombre[0].toUpperCase()}</div>
          <div>${nombre}</div>
        </div>`;
    });
  }
  document.getElementById("listaConfirmados").innerHTML = htmlConf;

  // solicitudes
  let htmlSol = '';
  if(!p.solicitudes || p.solicitudes.length === 0){
    htmlSol = `<div style="padding:0 20px;color:var(--text-muted);font-size:14px;">Sin solicitudes</div>`;
  } else {
    p.solicitudes.forEach((s, si) => {
      htmlSol += `
        <div class="solicitud-card">
          <div class="solicitud-header" onclick="abrirPerfilJugador('${s.nombre}', false)">
            <div class="mini-avatar">${s.nombre[0].toUpperCase()}</div>
            <div style="flex:1;">
              <div style="font-weight:600;">${s.nombre}</div>
              <div style="font-size:13px;color:var(--text-muted);">
                <span class="stars">★★★★★</span> 4.5 · ${s.posicion || 'Sin posición'}
              </div>
            </div>
            <span style="color:var(--text-muted)">›</span>
          </div>
          <div class="solicitud-actions">
            <button class="solicitud-btn btn-rechazar" onclick="rechazar(${si})">❌ Rechazar</button>
            <button class="solicitud-btn btn-aceptar" onclick="aceptar(${si})">✅ Aceptar</button>
          </div>
        </div>`;
    });
  }
  document.getElementById("listaSolicitudes").innerHTML = htmlSol;

  cambiarPantalla("creador");
}

function aceptar(i){
  let p = partidos[idx];
  let jugador = p.solicitudes[i];
  if(!p.confirmados) p.confirmados = [];
  p.confirmados.push(jugador.nombre);
  p.jugadores++;
  notificaciones.push({
    tipo: "aceptado",
    texto: `Aceptaste a ${jugador.nombre} en ${p.cancha}`,
    partidoIndex: idx,
    visto: false
  });
  p.solicitudes.splice(i, 1);
  guardar();
  verDetalle(idx);
}

function rechazar(i){
  partidos[idx].solicitudes.splice(i, 1);
  guardar();
  verDetalle(idx);
}

// ---- CHAT ----
function abrirChatPartido(){
  abrirChatIdx(idx);
}

function abrirChatHomeIdx(){
  abrirChatIdx(idx);
}

function abrirChatIdx(i){
  idx = i;
  let p = partidos[i];
  document.getElementById("chatTitle").textContent = p.cancha;
  renderChat();
  cambiarPantalla("chat");
}

function renderChat(){
  let p = partidos[idx];
  let html = '';
  (p.mensajes || []).forEach(m => {
    let own = perfil && m.nombre === perfil.nombre;
    html += `<div class="msg ${own ? 'msg-own' : 'msg-other'}">
      ${!own ? `<div class="msg-sender">${m.nombre}</div>` : ''}
      ${m.texto}
    </div>`;
  });
  document.getElementById("mensajes").innerHTML = html || `<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">Sin mensajes todavía.<br>¡Rompé el hielo!</div></div>`;
  const el = document.getElementById("mensajes");
  el.scrollTop = el.scrollHeight;
}

function enviarMensaje(){
  let txt = document.getElementById("mensajeInput").value.trim();
  if(!txt) return;
  if(!partidos[idx].mensajes) partidos[idx].mensajes = [];
  partidos[idx].mensajes.push({ nombre: perfil.nombre, texto: txt });
  document.getElementById("mensajeInput").value = '';
  guardar();
  renderChat();
}

// ---- NOTIFICACIONES ----
function verNotificaciones(){
  let html = '';
  if(notificaciones.length === 0){
    html = `<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">Sin notificaciones</div></div>`;
  } else {
    [...notificaciones].reverse().forEach((n, ri) => {
      let i = notificaciones.length - 1 - ri;
      html += `
        <div class="notif-item" onclick="abrirNotificacion(${i})">
          <div class="notif-dot ${n.visto ? 'visto' : ''}"></div>
          <div>
            <div class="notif-text">${n.texto}</div>
            <div class="notif-sub">${n.tipo === 'solicitud' ? 'Solicitud de partido' : 'Aceptado en partido'}</div>
          </div>
        </div>`;
    });
  }
  document.getElementById("listaNotificaciones").innerHTML = html;
  cambiarPantalla("notificaciones");
}

function abrirNotificacion(i){
  notificaciones[i].visto = true;
  idx = notificaciones[i].partidoIndex;
  guardar();
  if(notificaciones[i].tipo === "solicitud"){
    verDetalle(idx);
  } else {
    abrirChatIdx(idx);
  }
}

function limpiarNotificaciones(){
  notificaciones = [];
  guardar();
  actualizarBadge();
  verNotificaciones();
}

// ---- PERFIL JUGADOR MODAL ----
function abrirPerfilJugador(nombre, esCreador){
  let html = `
    <div class="modal-perfil-header">
      <div class="modal-avatar">${nombre[0].toUpperCase()}</div>
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;">${nombre}</div>
        <div style="font-size:13px;color:var(--text-muted);">
          <span class="stars">★★★★½</span> 4.5 · ${esCreador ? 'Creador' : 'Jugador'}
        </div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num">23</div>
        <div class="stat-label">Partidos</div>
      </div>
      <div class="stat-card" onclick="verOpinionesJugador('${nombre}')">
        <div class="stat-num">4.5</div>
        <div class="stat-label">Reputación</div>
      </div>
      <div class="stat-card" onclick="verOpinionesJugador('${nombre}')">
        <div class="stat-num">18</div>
        <div class="stat-label">Opiniones</div>
      </div>
    </div>
    <p class="section-title" style="margin-top:16px;">Bio</p>
    <div class="bio-text">Jugador de fin de semana, siempre puntual. Me gusta el toque corto.</div>
    <p class="section-title" style="margin-top:16px;">Zona</p>
    <div class="zona-row">📍 Pocitos, Montevideo</div>
    <p class="section-title" style="margin-top:16px;">Opiniones destacadas</p>
    <div>
      <span class="opinion-tag">👍 Puntual</span>
      <span class="opinion-tag">⚽ Juega en equipo</span>
      <span class="opinion-tag">🙌 Buena onda</span>
    </div>
    <button onclick="verOpinionesJugador('${nombre}'); cerrarModal();" style="width:100%;margin-top:16px;padding:12px;background:var(--surface2);border:1px solid #333;border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;">Ver todas las opiniones →</button>
  `;
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modalJugador").classList.add("show");
}

function cerrarModal(){
  document.getElementById("modalJugador").classList.remove("show");
}

// ---- OPINIONES ----
const opinionesData = [
  {emoji:'👍', label:'Puntual', pct:80, count:19},
  {emoji:'⚽', label:'Juega en equipo', pct:75, count:18},
  {emoji:'🔥', label:'Muy habilidoso', pct:70, count:17},
  {emoji:'💪', label:'Corre todo el partido', pct:65, count:16},
  {emoji:'🙌', label:'Buena onda', pct:85, count:20},
  {emoji:'🧠', label:'Entiende el juego', pct:60, count:14},
  {emoji:'🎯', label:'Define bien', pct:55, count:13},
  {emoji:'🎯', label:'Buenos pases', pct:68, count:16},
];
const opinionesTags = ['👍 Puntual','🔥 Muy habilidoso','😅 Morfeta','⚽ Juega en equipo','❌ No la pasa','🙌 Buena onda','⏰ Llega tarde'];

function verOpinionesJugador(nombre){
  renderOpiniones(nombre, () => cerrarModal());
}
function verOpinionesPropias(){
  renderOpiniones(perfil.nombre, () => verMiPerfil());
}

function renderOpiniones(nombre, backFn){
  document.getElementById("opinionesTitle").textContent = nombre;
  document.getElementById("opinionesBackBtn").onclick = () => { backFn(); cambiarPantalla("perfil"); };

  let barsHtml = opinionesData.map(o => `
    <div class="opinion-bar-row">
      <div class="opinion-bar-label">${o.emoji} ${o.label}</div>
      <div class="opinion-bar-track">
        <div class="opinion-bar-fill" style="width:${o.pct}%"></div>
      </div>
      <div class="opinion-bar-pct">${o.pct}%</div>
    </div>
  `).join('');

  let tagsHtml = opinionesTags.map(t => `<span class="opinion-tag">${t}</span>`).join('');

  document.getElementById("opinionesContent").innerHTML = `
    <div style="display:flex;align-items:baseline;gap:10px;margin:0 0 20px;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--green);">4.5</div>
      <div>
        <div class="stars" style="font-size:18px;">★★★★½</div>
        <div style="font-size:13px;color:var(--text-muted);">24 opiniones</div>
      </div>
    </div>
    <p class="section-title">Resumen</p>
    ${barsHtml}
    <p class="section-title" style="margin-top:20px;">Todas las opiniones</p>
    <div style="display:flex;flex-wrap:wrap;gap:0;">${tagsHtml}</div>
  `;
  cambiarPantalla("opiniones");
}

// ---- INIT ----
if(!perfil){
  cambiarPantalla("crearPerfil");
} else {
  render();
  cambiarPantalla("home");
}
</script>
</body>
</html>
